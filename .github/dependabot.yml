# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:

  # Monitor Composer (PHP) dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "php"
    # Group non-major updates together to reduce PR noise
    groups:
      laravel:
        patterns:
          - "laravel/*"
        update-types:
          - "minor"
          - "patch"
      symfony:
        patterns:
          - "symfony/*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "pestphp/*"
          - "mockery/*"
          - "nunomaduro/*"
          - "barryvdh/*"
          - "fakerphp/*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates (handle manually to avoid breaking changes)
    ignore:
      - dependency-name: "laravel/framework"
        update-types: ["version-update:semver-major"]

  # Monitor npm (frontend) dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
